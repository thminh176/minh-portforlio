name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Quick CI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
          run_install: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit tracked files & secrets
        run: pnpm run check:secrets

      - name: Run secret scanner self-checks
        run: pnpm run test:secrets

      - name: Test contact API & validation mocks
        run: pnpm run test:contact

      - name: Lint source & scripts
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Validate published content contract
        run: pnpm run test:content

      - name: Test content loader and build gate
        run: pnpm run test:content:loader

      - name: Test content navigation projections
        run: pnpm run test:content:navigation

      - name: Build static export
        run: pnpm build

      - name: Validate static export smoke checks
        run: pnpm run smoke:export
